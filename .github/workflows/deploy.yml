# Auto-deploy to Cloudflare Workers on every push to main.
# One-time setup: add a repo secret named CLOUDFLARE_API_TOKEN
# (GitHub → Settings → Secrets and variables → Actions), created at
# dash.cloudflare.com/profile/api-tokens with the "Edit Cloudflare Workers"
# template. App secrets (ANTHROPIC_API_KEY, COMPASS_PASSWORD) live on the
# Worker itself and persist across deploys — this workflow never touches them.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
